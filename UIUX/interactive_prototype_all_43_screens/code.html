e exists to make recreational sport effortless across Bangladesh. Whether you are short two players for Friday futsal in Banani or looking for an evening badminton court in Uttara, we connect reliable teammates, shared gear, and verified local venues without endless group-chat chaos.\n        <\/p>\n\n        <div class=\"flex flex-wrap items-center gap-4 pt-2\">\n          <a\n            href=\"../explore-matches/ExploreMatches.html\"\n            class=\"shrink-0 inline-flex items-center justify-center gap-2 px-6 py-3 rounded-md bg-primary text-on-primary font-label text-label-lg transition-opacity duration-state-change hover:opacity-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary\"\n          >\n            <span class=\"material-symbols-outlined text-title-md\" aria-hidden=\"true\">explore<\/span>\n            <span data-design-text-token=\"label-lg\">Explore Nearby Matches<\/span>\n          <\/a>\n          <a\n            href=\"../create-match/CreateMatch.html\"\n            class=\"shrink-0 inline-flex items-center justify-center gap-2 px-6 py-3 rounded-md bg-secondary text-on-secondary font-label text-label-lg transition-opacity duration-state-change hover:opacity-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-secondary\"\n          >\n            <span class=\"material-symbols-outlined text-title-md\" aria-hidden=\"true\">add_circle<\/span>\n            <span data-design-text-token=\"label-lg\">Organize a Quick Match<\/span>\n          <\/a>\n        <\/div>\n      <\/div>\n\n      <div class=\"lg:col-span-5\">\n        <div class=\"rounded-xl overflow-hidden border border-light-border dark:border-dark-border bg-light-surface dark:bg-dark-surface\">\n          <img src=\"../../images/hero_futsal_night.jpg\" alt=\"Players competing under floodlights at a Dhaka futsal turf\" class=\"w-full h-72 object-cover\">\n          <div class=\"p-5 grid grid-cols-3 gap-4 border-t border-light-border dark:border-dark-border\">\n            <div>\n              <p class=\"font-headline text-headline-md tabular-nums text-primary\" data-design-text-token=\"headline-md\">12+<\/p>\n              <p class=\"font-body text-body-sm text-light-muted dark:text-dark-muted\" data-design-text-token=\"body-sm\">Active sports<\/p>\n            <\/div>\n            <div>\n              <p class=\"font-headline text-headline-md tabular-nums text-light-on-surface dark:text-dark-on-surface\" data-design-text-token=\"headline-md\">64<\/p>\n              <p class=\"font-body text-body-sm text-light-muted dark:text-dark-muted\" data-design-text-token=\"body-sm\">Districts supported<\/p>\n            <\/div>\n            <div>\n              <p class=\"font-headline text-headline-md tabular-nums text-success\" data-design-text-token=\"headline-md\">98%<\/p>\n              <p class=\"font-body text-body-sm text-light-muted dark:text-dark-muted\" data-design-text-token=\"body-sm\">Match show-up<\/p>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- Mission & Vision Pillars -->\n    <section class=\"max-w-7xl mx-auto px-6 py-10 border-t border-light-border dark:border-dark-border\">\n      <div class=\"mb-8 max-w-2xl\">\n        <span class=\"font-label text-label-sm uppercase text-primary\" data-design-text-token=\"label-sm\">Mission &amp; Community Purpose<\/span>\n        <h2 class=\"font-headline text-headline-lg mt-1\" data-design-text-token=\"headline-lg\">Why We Built Khela Hobe<\/h2>\n      <\/div>\n\n      <div class=\"grid grid-cols-1 md:grid-cols-3 gap-6\">\n        <article class=\"rounded-lg bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border p-6 flex flex-col gap-3\">\n          <span class=\"w-11 h-11 rounded-md bg-light-surface-elevated dark:bg-dark-surface-elevated text-primary flex items-center justify-center\">\n            <span class=\"material-symbols-outlined text-title-lg\" aria-hidden=\"true\">bolt<\/span>\n          <\/span>\n          <h3 class=\"font-headline text-title-lg\" data-design-text-token=\"title-lg\">Instant Quick Matches<\/h3>\n          <p class=\"font-body text-body-md text-light-muted dark:text-dark-muted\" data-design-text-token=\"body-md\">\n            Quick Matches publish immediately without waiting on administrative approval queues, so organizers can fill open slots the same afternoon.\n          <\/p>\n        <\/article>\n\n        <article class=\"rounded-lg bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border p-6 flex flex-col gap-3\">\n          <span class=\"w-11 h-11 rounded-md bg-light-surface-elevated dark:bg-dark-surface-elevated text-secondary flex items-center justify-center\">\n            <span class=\"material-symbols-outlined text-title-lg\" aria-hidden=\"true\">sports_tennis<\/span>\n          <\/span>\n          <h3 class=\"font-headline text-title-lg\" data-design-text-token=\"title-lg\">Shared Equipment Pledges<\/h3>\n          <p class=\"font-body text-body-md text-light-muted dark:text-dark-muted\" data-design-text-token=\"body-md\">\n            Every match tracks Required, Committed, and Remaining gear transparently\u2014whether that is bibs, shuttlecock tubes, or match balls.\n          <\/p>\n        <\/article>\n\n        <article class=\"rounded-lg bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border p-6 flex flex-col gap-3\">\n          <span class=\"w-11 h-11 rounded-md bg-light-surface-elevated dark:bg-dark-surface-elevated text-accent flex items-center justify-center\">\n            <span class=\"material-symbols-outlined text-title-lg\" aria-hidden=\"true\">verified_user<\/span>\n          <\/span>\n          <h3 class=\"font-headline text-title-lg\" data-design-text-token=\"title-lg\">Trusted Local Play<\/h3>\n          <p class=\"font-body text-body-md text-light-muted dark:text-dark-muted\" data-design-text-token=\"body-md\">\n            Clear skill levels, organizer rosters, and post-match moderation keep neighborhood turfs welcoming for beginners and competitive players alike.\n          <\/p>\n        <\/article>\n      <\/div>\n    <\/section>\n\n    <!-- How It Works -->\n    <section id=\"how-it-works\" class=\"max-w-7xl mx-auto px-6 py-10 border-t border-light-border dark:border-dark-border\">\n      <div class=\"mb-8\">\n        <span class=\"font-label text-label-sm uppercase text-primary\" data-design-text-token=\"label-sm\">How It Works<\/span>\n        <h2 class=\"font-headline text-headline-lg mt-1\" data-design-text-token=\"headline-lg\">From Discovery to Kickoff in Four Steps<\/h2>\n      <\/div>\n\n      <div class=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5\">\n        <div class=\"rounded-lg bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border p-5 flex flex-col gap-2\">\n          <span class=\"font-mono text-mono-sm text-primary\" data-design-text-token=\"mono-sm\">STEP 01<\/span>\n          <h3 class=\"font-headline text-title-md\" data-design-text-token=\"title-md\">Discover Nearby<\/h3>\n          <p class=\"font-body text-body-sm text-light-muted dark:text-dark-muted\" data-design-text-token=\"body-sm\">\n            Filter Quick Matches by sport, Dhaka/Bangladesh area, skill tier, and Asia/Dhaka start time.\n          <\/p>\n        <\/div>\n\n        <div class=\"rounded-lg bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border p-5 flex flex-col gap-2\">\n          <span class=\"font-mono text-mono-sm text-primary\" data-design-text-token=\"mono-sm\">STEP 02<\/span>\n          <h3 class=\"font-headline text-title-md\" data-design-text-token=\"title-md\">Join or Apply<\/h3>\n          <p class=\"font-body text-body-sm text-light-muted dark:text-dark-muted\" data-design-text-token=\"body-sm\">\n            Tap Join Match for Open Join games, or send a position note for Approval Required rosters.\n          <\/p>\n        <\/div>\n\n        <div class=\"rounded-lg bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border p-5 flex flex-col gap-2\">\n          <span class=\"font-mono text-mono-sm text-primary\" data-design-text-token=\"mono-sm\">STEP 03<\/span>\n          <h3 class=\"font-headline text-title-md\" data-design-text-token=\"title-md\">Pledge Gear<\/h3>\n          <p class=\"font-body text-body-sm text-light-muted dark:text-dark-muted\" data-design-text-token=\"body-sm\">\n            Check remaining equipment needs and pledge what you can bring so nothing is missing at kickoff.\n          <\/p>\n        <\/div>\n\n        <div class=\"rounded-lg bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border p-5 flex flex-col gap-2\">\n          <span class=\"font-mono text-mono-sm text-primary\" data-design-text-token=\"mono-sm\">STEP 04<\/span>\n          <h3 class=\"font-headline text-title-md\" data-design-text-token=\"title-md\">Show Up &amp; Play<\/h3>\n          <p class=\"font-body text-body-sm text-light-muted dark:text-dark-muted\" data-design-text-token=\"body-sm\">\n            Meet at the public venue, check in with your organizer, and build your player reliability record.\n          <\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- Safety & Guardian Principles + Contact Support -->\n    <section id=\"safety\" class=\"max-w-7xl mx-auto px-6 py-10 border-t border-light-border dark:border-dark-border grid grid-cols-1 lg:grid-cols-12 gap-6\">\n      <div class=\"lg:col-span-7 rounded-lg bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border p-6 flex flex-col gap-4\">\n        <div class=\"flex items-center gap-3\">\n          <span class=\"w-10 h-10 rounded-md bg-light-surface-elevated dark:bg-dark-surface-elevated text-success flex items-center justify-center\">\n            <span class=\"material-symbols-outlined text-title-lg\" aria-hidden=\"true\">shield_person<\/span>\n          <\/span>\n          <div>\n            <h2 class=\"font-headline text-title-lg\" data-design-text-token=\"title-lg\">Safety &amp; Guardian Protection Principles<\/h2>\n            <p class=\"font-body text-body-sm text-light-muted dark:text-dark-muted\" data-design-text-token=\"body-sm\">Designed to protect youth athletes and community members.<\/p>\n          <\/div>\n        <\/div>\n\n        <ul class=\"flex flex-col gap-3 font-body text-body-md text-light-muted dark:text-dark-muted\">\n          <li class=\"flex items-start gap-2.5\">\n            <span class=\"material-symbols-outlined text-success text-title-md mt-0.5 shrink-0\" aria-hidden=\"true\">check_circle<\/span>\n            <span><strong class=\"text-light-on-surface dark:text-dark-on-surface\">Public Venues Only:<\/strong> Match locations display verified turfs, courts, and fields\u2014never private residential coordinates.<\/span>\n          <\/li>\n          <li class=\"flex items-start gap-2.5\">\n            <span class=\"material-symbols-outlined text-success text-title-md mt-0.5 shrink-0\" aria-hidden=\"true\">check_circle<\/span>\n            <span><strong class=\"text-light-on-surface dark:text-dark-on-surface\">Authorized Guardian Linking:<\/strong> Safety IDs only initiate a linking request; child activity remains private until the child and backend approve authorization.<\/span>\n          <\/li>\n          <li class=\"flex items-start gap-2.5\">\n            <span class=\"material-symbols-outlined text-success text-title-md mt-0.5 shrink-0\" aria-hidden=\"true\">check_circle<\/span>\n            <span><strong class=\"text-light-on-surface dark:text-dark-on-surface\">Active Moderation:<\/strong> Any player can report unsafe conduct or venue issues for rapid review by Khela Hobe moderators.<\/span>\n          <\/li>\n        <\/ul>\n      <\/div>\n\n      <div class=\"lg:col-span-5 rounded-lg bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border p-6 flex flex-col justify-between gap-5\">\n        <div class=\"flex flex-col gap-3\">\n          <h2 class=\"font-headline text-title-lg\" data-design-text-token=\"title-lg\">Contact &amp; Community Support<\/h2>\n          <p class=\"font-body text-body-md text-light-muted dark:text-dark-muted\" data-design-text-token=\"body-md\">\n            Need help with a match dispute, venue listing, or guardian linking? Our Dhaka community team responds daily between 9:00 AM and 10:00 PM BST.\n          <\/p>\n          <div class=\"flex flex-col gap-2 pt-2\">\n            <div class=\"flex items-center gap-2.5 font-body text-body-md\">\n              <span class=\"material-symbols-outlined text-primary text-title-md\" aria-hidden=\"true\">mail<\/span>\n              <span>support@khelahobe.bd<\/span>\n            <\/div>\n            <div class=\"flex items-center gap-2.5 font-body text-body-md\">\n              <span class=\"material-symbols-outlined text-primary text-title-md\" aria-hidden=\"true\">location_on<\/span>\n              <span>Banani, Dhaka 1213, Bangladesh<\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"pt-4 border-t border-light-border dark:border-dark-border flex flex-wrap gap-3\">\n          <a href=\"../explore-matches/ExploreMatches.html\" class=\"shrink-0 inline-flex items-center justify-center px-4 py-2.5 rounded-md bg-primary text-on-primary font-label text-label-lg hover:opacity-90\">\n            <span data-design-text-token=\"label-lg\">Browse Matches<\/span>\n          <\/a>\n          <a href=\"../register/Register.html\" class=\"shrink-0 inline-flex items-center justify-center px-4 py-2.5 rounded-md bg-light-surface-elevated dark:bg-dark-surface-elevated border border-light-border dark:border-dark-border font-label text-label-lg hover:border-primary\">\n            <span data-design-text-token=\"label-lg\">Create Free Account<\/span>\n     const metaById = Object.fromEntries(SCREENS_META.map(s => [s.id, s]));

    let state = {
      currentId: 'landing',
      viewportMode: 'desktop', // 'desktop' | 'mobile'
      darkMode: true,
      history: ['landing'],
      historyIndex: 0
    };

    const frame = document.getElementById('prototype-frame');
    const deviceFrame = document.getElementById('device-frame');
    const stageContainer = document.getElementById('stage-container');
    const drawer = document.getElementById('screen-drawer');
    const screenListEl = document.getElementById('screen-list');
    const searchInput = document.getElementById('screen-search');
    const titleEl = document.getElementById('current-screen-title');
    const groupEl = document.getElementById('current-group-badge');
    const backBtn = document.getElementById('nav-back-btn');
    const fwdBtn = document.getElementById('nav-forward-btn');
    const vpDesktopBtn = document.getElementById('vp-desktop-btn');
    const vpMobileBtn = document.getElementById('vp-mobile-btn');
    const themeIcon = document.getElementById('theme-icon');
    const toastEl = document.getElementById('proto-toast');
    const toastTextEl = document.getElementById('proto-toast-text');
    let toastTimer = null;

    function showToast(msg) {
      toastTextEl.textContent = msg;
      toastEl.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.add('hidden'), 2200);
    }

    // Build resolved asset URL map from hidden #asset-registry
    function getAssetMap() {
      const map = {};
      document.querySelectorAll('#asset-registry img[data-asset]').forEach(img => {
        map[img.getAttribute('data-asset')] = img.src;
      });
      return map;
    }

    // Bridge script injected into every rendered screen
    const BRIDGE_SCRIPT = `
      <script>
        (function() {
          document.addEventListener('click', function(e) {
            const link = e.target.closest('a, button, [role="button"]');
            if (!link) return;
            const href = link.getAttribute('href') || '';
            // Allow same-page hash anchors like #sports to scroll smoothly
            if (href.startsWith('#') && href.length > 1) return;
            if (href === '#' || link.tagName === 'A') e.preventDefault();
            const text = (link.innerText || link.getAttribute('aria-label') || '').trim().replace(/\s+/g, ' ');
            const hasOnClick = link.hasAttribute('onclick');
            // Let inline tab/toggle scripts run, but also notify parent for navigation
            window.parent.postMessage({
              type: 'kh-click',
              text: text,
              href: href,
              tag: link.tagName,
              hasOnClick: hasOnClick
            }, '*');
          }, true);

          document.addEventListener('submit', function(e) {
            e.preventDefault();
            window.parent.postMessage({ type: 'kh-submit' }, '*');
          }, true);

          window.addEventListener('message', function(ev) {
            if (ev.data && ev.data.type === 'kh-theme') {
              document.documentElement.classList.toggle('dark', !!ev.data.dark);
            }
          });
        })();
      <\/script>
    `;

    function prepareScreenHtml(screenId) {
      let raw = SCREENS_HTML[screenId] || '';
      const assetMap = getAssetMap();
      for (const [relPath, resolvedUrl] of Object.entries(assetMap)) {
        raw = raw.split(relPath).join(resolvedUrl);
      }
      // Inline tailwind.config so srcdoc never fails to load relative ../../tailwind.config.js
      if (window.tailwind && window.tailwind.config) {
        const cfgScript = `<script>window.tailwind=window.tailwind||{};window.tailwind.config=${JSON.stringify(window.tailwind.config)};<\/script>`;
        raw = raw.replace(/<script[^>]*id=["']tailwind-config["'][^>]*><\/script>/i, cfgScript);
      }
      // Sync dark/light mode class
      if (state.darkMode) {
        raw = raw.replace(/<html([^>]*)>/i, (m, attrs) => attrs.includes('dark') ? m : `<html${attrs} class="dark">`);
      } else {
        raw = raw.replace(/<html([^>]*)class=["']([^"']*)["']([^>]*)>/i, (m, a, cls, b) => `<html${a}class="${cls.replace(/\bdark\b/g, '').trim()}"${b}>`);
      }
      // Inject bridge script before </body>
      if (raw.includes('</body>')) {
        raw = raw.replace('</body>', BRIDGE_SCRIPT + '</body>');
      } else {
        raw += BRIDGE_SCRIPT;
      }
      return raw;
    }

    function renderScreen() {
      const meta = metaById[state.currentId];
      if (!meta) return;

      titleEl.textContent = meta.title;
      groupEl.textContent = meta.group;

      // Update viewport frame sizing
      const isMobile = state.viewportMode === 'mobile' || meta.viewport === 'mobile';
      if (isMobile) {
        stageContainer.classList.add('p-6');
        deviceFrame.className = 'w-[390px] h-[844px] mx-auto my-auto rounded-xl border-2 border-dark-border overflow-hidden shrink-0 flex flex-col';
        frame.style.minHeight = '844px';
      } else {
        stageContainer.classList.remove('p-6');
        deviceFrame.className = 'w-full h-full flex flex-col';
        frame.style.minHeight = '960px';
      }

      // Update viewport toggle buttons
      if (state.viewportMode === 'mobile') {
        vpMobileBtn.className = 'px-2.5 py-1 rounded-sm font-label text-label-sm bg-primary text-on-primary inline-flex items-center gap-1 transition-colors duration-state-change';
        vpDesktopBtn.className = 'px-2.5 py-1 rounded-sm font-label text-label-sm text-light-muted dark:text-dark-muted hover:text-light-on-surface dark:hover:text-dark-on-surface inline-flex items-center gap-1 transition-colors duration-state-change';
      } else {
        vpDesktopBtn.className = 'px-2.5 py-1 rounded-sm font-label text-label-sm bg-primary text-on-primary inline-flex items-center gap-1 transition-colors duration-state-change';
        vpMobileBtn.className = 'px-2.5 py-1 rounded-sm font-label text-label-sm text-light-muted dark:text-dark-muted hover:text-light-on-surface dark:hover:text-dark-on-surface inline-flex items-center gap-1 transition-colors duration-state-change';
      }

      backBtn.disabled = state.historyIndex <= 0;
      fwdBtn.disabled = state.historyIndex >= state.history.length - 1;

      frame.srcdoc = prepareScreenHtml(state.currentId);
      renderDrawerList(searchInput.value);
    }

    function navigateTo(targetId, pushHistory = true) {
      if (!metaById[targetId]) return;
      // Respect current viewport mode if a paired mobile/desktop screen exists
      const targetMeta = metaById[targetId];
      if (state.viewportMode === 'mobile' && targetMeta.viewport === 'desktop' && targetMeta.paired) {
        targetId = targetMeta.paired;
      } else if (state.viewportMode === 'desktop' && targetMeta.viewport === 'mobile' && targetMeta.paired) {
        targetId = targetMeta.paired;
      }
      if (targetId === state.currentId) return;
      if (pushHistory) {
        state.history = state.history.slice(0, state.historyIndex + 1);
        state.history.push(targetId);
        state.historyIndex = state.history.length - 1;
      }
      state.currentId = targetId;
      renderScreen();
      showToast('Navigated to ' + metaById[targetId].title);
    }

    // Semantic click-to-screen router
    function routeFromClick(rawText, currentId) {
      const t = rawText.toLowerCase();
      if (!t) return null;

      if (t === 'arrow_back' || t === 'back' || t.startsWith('back to ')) {
        if (state.historyIndex > 0) {
          state.historyIndex--;
          state.currentId = state.history[state.historyIndex];
          renderScreen();
          showToast('Back to ' + metaById[state.currentId].title);
        }
        return '__HANDLED__';
      }

      const rules = [
        [/\bsign in\b|\blog in\b|\blogin\b/, 'login'],
        [/\bjoin free\b|\bcreate account\b|\bsign up\b|\bregister\b/, 'register'],
        [/\babout us\b|\babout khela hobe\b/, 'about-us'],
        [/\bcreate quick match\b|\bcreate match\b|\bhost a match\b|\bnew match\b/, 'create-match'],
        [/\bmap view\b|\bview map\b|^map$/, 'map-view'],
        [/\bexplore matches\b|\bbrowse matches\b|\bfind matches\b|^explore$/, 'explore-matches'],
        [/\bmy applications\b|\bapplications\b/, 'my-applications'],
        [/\bcreated matches\b|\bmy created matches\b/, 'my-created-matches'],
        [/\bmy matches\b/, 'my-matches'],
        [/\bmy tickets\b/, 'my-tickets'],
        [/\bticket check-in\b|\bcheck-in\b|\bcheck in\b|\bscan ticket\b/, 'ticket-checkin'],
        [/\bbook ticket\b|\bget tickets\b|\bticket booking\b|\bbuy ticket\b/, 'ticket-booking'],
        [/\bevent management\b|\bmanage events\b/, 'event-management'],
        [/\bevent details\b|\bfutsal cup\b|\bview event\b/, 'event-details'],
        [/\bmatch details\b|\bview match\b|\bjoin match\b|\bapply to join\b/, 'match-details'],
        [/\bapplication review\b|\breview applications\b/, 'application-review'],
        [/\bparticipant management\b|\bparticipants\b|\bmanage roster\b/, 'participant-management'],
        [/\bmatch management\b|\bmanage match\b/, 'match-management'],
        [/\borganizer profile\b/, 'organizer-profile'],
        [/\borganizer hub\b|\borganizer dashboard\b|^organizer$/, 'organizer-dashboard'],
        [/\blinked children\b|\bchildren\b/, 'linked-children'],
        [/\bchild activity\b|\bactivity log\b/, 'child-activity'],
        [/\bsafety alerts\b|\balerts\b/, 'safety-alerts'],
        [/\bchild safety settings\b|\bsafety settings\b/, 'child-safety-settings'],
        [/\bguardian dashboard\b|\bguardian safety\b|^guardian$/, 'guardian-dashboard'],
        [/\buser management\b|\bmanage users\b|^users$/, 'admin-users'],
        [/\bmatch moderation\b|\bmoderate matches\b/, 'admin-matches'],
        [/\breports management\b|\breports\b/, 'reports-management'],
        [/\bsports management\b|\bsports catalog\b/, 'sports-management'],
        [/\badmin dashboard\b|\badmin panel\b|^admin$/, 'admin-dashboard'],
        [/\bedit profile\b/, 'edit-profile'],
        [/\bplayer profile\b|\bmy profile\b|^profile$/, 'player-profile'],
        [/\bnotifications\b/, 'notifications'],
        [/^home$|\bhome discovery\b|\bdiscovery\b/, 'home-discovery'],
        [/\bkhela hobe\b/, currentId === 'landing' || currentId === 'login' || currentId === 'register' || currentId === 'about-us' ? 'landing' : 'home-discovery']
      ];

      for (const [regex, dest] of rules) {
        if (regex.test(t) && dest !== currentId) return dest;
      }
      return null;
    }

    window.addEventListener('message', (ev) => {
      if (!ev.data) return;
      if (ev.data.type === 'kh-click') {
        const dest = routeFromClick(ev.data.text, state.currentId);
        if (dest === '__HANDLED__') return;
        if (dest) {
          navigateTo(dest);
        } else if (ev.data.text && !ev.data.hasOnClick) {
          showToast('Interactive control: ' + ev.data.text.slice(0, 36));
        }
      } else if (ev.data.type === 'kh-submit') {
        const submitNext = {
          'login': 'home-discovery',
          'register': 'home-discovery',
          'create-match': 'match-management',
          'ticket-booking': 'my-tickets',
          'edit-profile': 'player-profile',
          'child-safety-settings': 'guardian-dashboard'
        };
        const dest = submitNext[state.currentId];
        if (dest) navigateTo(dest);
        else showToast('Form submitted');
      }
    });

    function renderDrawerList(filter = '') {
      const q = filter.trim().toLowerCase();
      const groups = [...new Set(SCREENS_META.map(s => s.group))];
      screenListEl.innerHTML = '';

      groups.forEach(group => {
        const items = SCREENS_META.filter(s =>
          s.group === group &&
          (!q || s.title.toLowerCase().includes(q) || s.group.toLowerCase().includes(q))
        );
        if (!items.length) return;

        const section = document.createElement('div');
        section.className = 'flex flex-col gap-1';

        const heading = document.createElement('div');
        heading.className = 'px-2 py-1 font-label text-label-sm uppercase text-light-muted dark:text-dark-muted';
        heading.textContent = group + ' (' + items.length + ')';
        section.appendChild(heading);

        items.forEach(item => {
          const active = item.id === state.currentId;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = active
            ? 'w-full text-left px-2.5 py-2 rounded-md bg-primary text-on-primary font-label text-label-md flex items-center justify-between gap-2'
            : 'w-full text-left px-2.5 py-2 rounded-md text-light-on-surface dark:text-dark-on-surface hover:bg-light-surface-elevated dark:hover:bg-dark-surface-elevated font-body text-body-md flex items-center justify-between gap-2 transition-colors duration-state-change';

          const label = document.createElement('span');
          label.className = 'truncate';
          label.textContent = item.title;

          const icon = document.createElement('span');
          icon.className = 'material-symbols-outlined text-body-md shrink-0 opacity-75';
          icon.textContent = item.viewport === 'mobile' ? 'smartphone' : 'desktop_windows';

          btn.appendChild(label);
          btn.appendChild(icon);
          btn.addEventListener('click', () => {
            state.viewportMode = item.viewport;
            navigateTo(item.id);
            drawer.classList.add('hidden');
          });
          section.appendChild(btn);
        });

        screenListEl.appendChild(section);
      });
    }

    // Wire top bar controls
    document.getElementById('toggle-drawer-btn').addEventListener('click', () => {
      drawer.classList.toggle('hidden');
      if (!drawer.classList.contains('hidden')) searchInput.focus();
    });
    document.getElementById('close-drawer-btn').addEventListener('click', () => drawer.classList.add('hidden'));
    searchInput.addEventListener('input', (e) => renderDrawerList(e.target.value));

    backBtn.addEventListener('click', () => {
      if (state.historyIndex > 0) {
        state.historyIndex--;
        state.currentId = state.history[state.historyIndex];
        renderScreen();
      }
    });
    fwdBtn.addEventListener('click', () => {
      if (state.historyIndex < state.history.length - 1) {
        state.historyIndex++;
        state.currentId = state.history[state.historyIndex];
        renderScreen();
      }
    });

    document.querySelectorAll('.role-pill').forEach(btn => {
      btn.addEventListener('click', () => navigateTo(btn.getAttribute('data-jump')));
    });

    vpDesktopBtn.addEventListener('click', () => {
      state.viewportMode = 'desktop';
      const cur = metaById[state.currentId];
      if (cur && cur.viewport === 'mobile' && cur.paired) {
        state.currentId = cur.paired;
      }
      renderScreen();
    });
    vpMobileBtn.addEventListener('click', () => {
      state.viewportMode = 'mobile';
      const cur = metaById[state.currentId];
      if (cur && cur.viewport === 'desktop' && cur.paired) {
        state.currentId = cur.paired;
      }
      renderScreen();
    });

    document.getElementById('theme-toggle-btn').addEventListener('click', () => {
      state.darkMode = !state.darkMode;
      document.documentElement.classList.toggle('dark', state.darkMode);
      themeIcon.textContent = state.darkMode ? 'light_mode' : 'dark_mode';
      if (frame.contentWindow) {
        frame.contentWindow.postMessage({ type: 'kh-theme', dark: state.darkMode }, '*');
      }
    });

    // Initial render
    renderScreen();
  </script>


</body></html>
