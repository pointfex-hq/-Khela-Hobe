<body class="bg-light-background dark:bg-dark-background text-light-on-background dark:text-dark-on-background font-body antialiased min-h-[1024px] flex flex-col items-center justify-center p-6" data-stitch-vh="min-h-[1024px]===min-h-screen">

  <main class="w-full max-w-md flex flex-col gap-6">
    <a href="#" class="flex items-center justify-center gap-2.5">
      <span class="w-10 h-10 rounded-md bg-primary text-on-primary flex items-center justify-center">
        <span class="material-symbols-outlined text-title-lg" aria-hidden="true">sports_soccer</span>
      </span>
      <span class="font-headline text-headline-md" data-design-text-token="headline-md">Khela Hobe</span>
    </a>

    <section class="rounded-lg bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border p-8 flex flex-col gap-6">
      <div class="flex flex-col gap-1">
        <h1 class="font-headline text-headline-md" data-design-text-token="headline-md">Welcome Back</h1>
        <p class="font-body text-body-md text-light-muted dark:text-dark-muted" data-design-text-token="body-md">Sign in to one account for Player, Organizer, and Guardian workspaces.</p>
      </div>

      <form class="flex flex-col gap-4">
        <label class="flex flex-col gap-1.5">
          <span class="font-label text-label-md" data-design-text-token="label-md">Email or Phone Number</span>
          <input type="text" placeholder="tanvir@khelahobe.bd or +880 17..." class="w-full px-3.5 py-2.5 rounded-md bg-light-background dark:bg-dark-background border border-light-border dark:border-dark-border font-body text-body-md focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus:border-primary">
        </label>

        <label class="flex flex-col gap-1.5">
          <div class="flex items-center justify-between">
            <span class="font-label text-label-md" data-design-text-token="label-md">Password</span>
            <a href="#" class="font-label text-label-sm text-primary hover:underline" data-design-text-token="label-sm">Forgot password?</a>
          </div>
          <div class="relative flex items-center">
            <input type="password" placeholder="Enter your password" class="w-full pl-3.5 pr-10 py-2.5 rounded-md bg-light-background dark:bg-dark-background border border-light-border dark:border-dark-border font-body text-body-md focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus:border-primary">
            <button type="button" aria-label="Show password" class="absolute right-3 text-light-muted dark:text-dark-muted hover:text-light-on-surface dark:hover:text-dark-on-surface">
              <span class="material-symbols-outlined text-title-md" aria-hidden="true">visibility</span>
            </button>
          </div>
        </label>

        <label class="flex items-center gap-2.5 cursor-pointer">
          <input type="checkbox" checked class="rounded text-primary focus:ring-primary">
          <span class="font-body text-body-sm text-light-muted dark:text-dark-muted" data-design-text-token="body-sm">Keep me signed in on this device</span>
        </label>

        <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full py-3 rounded-md bg-primary text-on-primary font-label text-label-lg hover:opacity-90 mt-2">
          <span data-design-text-token="label-lg">Sign In</span>
        </button>
      </form>

      <p class="font-body text-body-sm text-light-muted dark:text-dark-muted text-center" data-design-text-token="body-sm">
        New to Khela Hobe? <a href="#" class="font-label text-label-md text-primary hover:underline">Create an Account</a>
      </p>
    </section>
  </main>



</body></html>
