  <style>.material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-light-background dark:bg-dark-background text-light-on-background dark:text-dark-on-background font-body antialiased min-h-[1024px] flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">

  <header class="sticky top-0 z-20 h-16 border-b border-light-border dark:border-dark-border bg-light-background dark:bg-dark-background px-4 sm:px-6 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Back to Event Management" class="inline-flex items-center justify-center w-9 h-9 rounded-md bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border hover:border-primary">
        <span class="material-symbols-outlined text-title-md" aria-hidden="true">arrow_back</span>
      </button>
      <div>
        <h1 class="font-headline text-title-lg" data-design-text-token="title-lg">Gate Check-In &amp; QR Verification</h1>
        <p class="font-body text-body-sm text-light-muted dark:text-dark-muted" data-design-text-token="body-sm">Dhaka Floodlit Futsal Cup 2026</p>
      </div>
    </div>
    <span class="px-3 py-1 rounded-full bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border font-label text-label-sm text-warning shrink-0" data-design-text-token="label-sm">Server Verification Required</span>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-page-margin flex flex-col gap-6">
    <div class="rounded-lg bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border p-8 flex flex-col items-center text-center gap-4">
      <div class="w-48 h-48 rounded-lg border-2 border-dashed border-primary bg-light-surface-elevated dark:bg-dark-surface-elevated flex flex-col items-center justify-center gap-2">
        <span class="material-symbols-outlined text-display-lg text-primary" aria-hidden="true">qr_code_scanner</span>
        <span class="font-label text-label-sm text-light-muted dark:text-dark-muted" data-design-text-token="label-sm">Camera Scanner Frame</span>
      </div>
      <h2 class="font-headline text-title-lg" data-design-text-token="title-lg">Scan Attendee Ticket QR</h2>
      <p class="font-body text-body-md text-light-muted dark:text-dark-muted max-w-md" data-design-text-token="body-md">
        Ticket codes are verified exclusively against the backend ticketing service. Offline or frontend-only validation is disabled.
      </p>
    </div>

    <div class="rounded-lg bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border p-6 flex flex-col gap-3">
      <label class="flex flex-col gap-1.5">
        <span class="font-label text-label-md" data-design-text-token="label-md">Manual Ticket Code Lookup</span>
        <div class="flex gap-3">
          <input type="text" placeholder="KH-EVT-2026-XXXX" class="flex-1 px-3.5 py-2.5 rounded-md bg-light-background dark:bg-dark-background border border-light-border dark:border-dark-border font-mono text-mono-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
          <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="shrink-0 px-5 py-2.5 rounded-md bg-primary text-on-primary font-label text-label-lg hover:opacity-90">
            <span data-design-text-token="label-lg">Verify Ticket</span>
          </button>
        </div>
      </label>
    </div>
  </main>



</body></html>
