services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: khelahobe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "khelahobe", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:password@db:5432/khelahobe"
      SESSION_SECRET: "${SESSION_SECRET:-changeme}"
      FRONTEND_ORIGIN: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./tests:/app/tests
      - ./package.json:/app/package.json
      - backend_node_modules:/app/node_modules
    command: npm run dev
    networks:
      - backend
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json

volumes:
  db_data:
  backend_node_modules:

networks:
  backend:
    driver: bridge